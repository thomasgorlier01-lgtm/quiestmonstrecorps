let sequence=[],round=0,score=0,lives=3,locked=false,ended=false,timer=null;

function display(){progress.textContent=`Question ${Math.min(round+1,10)}/10`;scoreEl.textContent=`⭐ ${score} point${score!==1?'s':''}`;hearts.innerHTML=Array.from({length:3},(_,i)=>`<span class="heart ${i>=lives?'lost':''}">${i<lives?'❤️':'🖤'}</span>`).join('');desc.textContent=DATA[sequence[round]].description;hint.textContent='Lis bien tous les indices.';msg.textContent='';msg.className='message';locked=false;document.querySelectorAll('.monster').forEach(b=>{b.className='monster';b.disabled=false})}
function finish(){ended=true;locked=true;document.querySelectorAll('.monster').forEach(b=>b.disabled=true);desc.textContent=lives===0?'Tu as perdu tes trois vies.':'Bravo, tu as terminé les dix descriptions !';hint.textContent='Partie terminée';msg.textContent=`Ton score : ${score}/10. Appuie sur « Nouvelle partie » pour rejouer.`;msg.className='message '+(lives===0?'bad':'ok');progress.textContent='Terminé'}
function choose(i){if(locked||ended)return;let button=document.querySelector(`[data-id="${i}"]`);if(i===sequence[round]){locked=true;score++;button.classList.add('correct');msg.textContent='✅ Bravo ! +1 point';msg.className='message ok';scoreEl.textContent=`⭐ ${score} point${score!==1?'s':''}`;timer=setTimeout(()=>{if(round===9){finish()}else{round++;display()}},900)}else{lives--;button.classList.add('wrong');msg.textContent=lives>0?'❌ Essaie encore : tu perds un cœur.':'❌ Tu as perdu ton dernier cœur.';msg.className='message bad';hearts.innerHTML=Array.from({length:3},(_,j)=>`<span class="heart ${j>=lives?'lost':''}">${j<lives?'❤️':'🖤'}</span>`).join('');if(lives===0){timer=setTimeout(finish,850)}else{setTimeout(()=>button.classList.remove('wrong'),650)}}}
function start(){clearTimeout(timer);sequence=shuffle([...Array(DATA.length).keys()]).slice(0,10);round=0;score=0;lives=3;locked=false;ended=false;display()}
DATA.forEach((m,i)=>{const button=document.createElement('button');button.className='monster';button.type='button';button.dataset.id=i;button.title=m.name;button.setAttribute('aria-label',m.name);const img=document.createElement('img');img.src=m.src;img.alt=m.name;button.appendChild(img);button.onclick=()=>choose(i);grid.appendChild(button)});document.querySelector('#restart').onclick=start;start();
</script></body></html>
