const grid=document.querySelector('#grid'),description=document.querySelector('#description'),message=document.querySelector('#message'),progress=document.querySelector('#progress'),hearts=document.querySelector('#hearts'),scoreEl=document.querySelector('#score'),hint=document.querySelector('#hint');let sequence=[],round=0,score=0,lives=3,locked=false,ended=false,timer=null;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function drawHearts(){hearts.innerHTML=Array.from({length:3},(_,j)=>`<span class="heart ${j>=lives?'lost':''}">${j<lives?'❤️':'🖤'}</span>`).join('')}
function display(){locked=false;message.textContent='';message.className='message';document.querySelectorAll('.monster').forEach(b=>b.classList.remove('correct','wrong'));progress.textContent=`Description ${round+1} sur 10`;description.textContent=DATA[sequence[round]].description;drawHearts()}
function finish(){ended=true;locked=true;description.textContent=lives===0?'Partie terminée !':'Bravo, tu as terminé les dix descriptions !';hint.textContent='Partie terminée';message.textContent=`Ton score : ${score}/10. Appuie sur « Nouvelle partie » pour rejouer.`;message.className='message '+(lives===0?'bad':'ok');progress.textContent='Terminé'}
function choose(i){if(locked||ended)return;let button=document.querySelector(`[data-id="${i}"]`);if(i===sequence[round]){locked=true;score++;button.classList.add('correct');message.textContent='✅ Bravo ! +1 point';message.className='message ok';scoreEl.textContent=`⭐ ${score} point${score!==1?'s':''}`;timer=setTimeout(()=>{if(round===9)finish();else{round++;display()}},900)}else{lives--;button.classList.add('wrong');message.textContent=lives>0?'❌ Essaie encore : tu perds un cœur.':'❌ Tu as perdu ton dernier cœur.';message.className='message bad';drawHearts();if(lives===0){timer=setTimeout(finish,850)}else{setTimeout(()=>button.classList.remove('wrong'),650)}}}
function start(){clearTimeout(timer);sequence=shuffle([...Array(DATA.length).keys()]).slice(0,10);round=0;score=0;lives=3;locked=false;ended=false;scoreEl.textContent='⭐ 0 point';hint.textContent='Choisis le monstre qui correspond à la description.';display()}
DATA.forEach((m,i)=>{const button=document.createElement('button');button.className='monster';button.type='button';button.dataset.id=i;button.title=m.name;button.setAttribute('aria-label',m.name);const img=document.createElement('img');img.src=m.src;img.alt=m.name;button.appendChild(img);button.onclick=()=>choose(i);grid.appendChild(button)});document.querySelector('#restart').onclick=start;start();
</script></body></html>
